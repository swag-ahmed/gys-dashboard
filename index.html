<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="application-name" content="GYS" />
    <meta name="apple-mobile-web-app-title" content="GYS" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; frame-src https://script.google.com https://*.googleusercontent.com; script-src 'self'; style-src 'self'; img-src 'self' data:; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <title>GYS Team Dashboard</title>
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="style.css?v=20261120-design" />
    <script src="shell.js?v=20261120-routing-fix" defer></script>
  </head>
  <body>
    <div id="loading" role="status" aria-live="polite">
      <span class="mark">LV</span>
      <h1>LeadsVector · GYS Research</h1>
      <p>Opening your dashboard…</p>
    </div>
    <iframe
      id="dashboard"
      title="GYS Team Dashboard"
      credentialless
      src="https://script.google.com/macros/s/AKfycby560PC_xP5BuXrmuO2-7OHNdph0pXzXPtEgAADRcNRySLtyOqB8DVBlCS01vgCi1nKRA/exec"
      allow="clipboard-write *; fullscreen *"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
    <aside id="help" hidden>
      <span>Having trouble loading?</span
      ><button id="reload" type="button">Reload dashboard</button
      ><a
        href="https://script.google.com/macros/s/AKfycby560PC_xP5BuXrmuO2-7OHNdph0pXzXPtEgAADRcNRySLtyOqB8DVBlCS01vgCi1nKRA/exec"
        target="_blank"
        rel="noopener noreferrer"
        >Open directly</a
      ><button id="dismiss" type="button" aria-label="Dismiss loading help">
        Dismiss
      </button>
    </aside>
    <noscript>Please enable JavaScript to use the GYS dashboard.</noscript>
  </body>
</html>
